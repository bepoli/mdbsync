name: Sync Letterboxd Watchlist

on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run sync
        env:
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
        run: bash pull_letterboxd.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Persist last_sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_sync
          if ! git diff --staged --quiet; then
            git commit -m "chore: update last_sync"
            git push
          fi

      - name: Send summary to Telegram
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        run: |
          if [ -s "$GITHUB_STEP_SUMMARY" ]; then
            TEXT="$(cat "$GITHUB_STEP_SUMMARY")"
          else
            TEXT="Sync completed, but summary was empty."
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_TO}" \
            --data-urlencode "text=${TEXT}"
